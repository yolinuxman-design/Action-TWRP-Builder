name: Build A2 Core Kernel (FIPS Fix)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source URL'
        required: true
        default: 'https://github.com/samsungexynos7870/android_kernel_samsung_exynos7870'
      kernel_branch:
        description: 'Kernel branch'
        required: true
        default: 'master'
      defconfig:
        description: 'Defconfig name (use exynos7870-a6lte_defconfig as base)'
        required: true
        default: 'exynos7870-a6lte_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64

    steps:
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev libwxgtk3.0-gtk3-dev

      - name: Setup Android GCC 4.9 toolchain
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            aarch64-linux-android-4.9
          echo "CROSS_COMPILE=$(pwd)/aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> $GITHUB_ENV

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch }} \
            ${{ github.event.inputs.kernel_repo }} ~/kernel

      - name: Prepare defconfig
        run: |
          cd ~/kernel
          BASE_DEFCONFIG=${{ github.event.inputs.defconfig }}
          A2_DEFCONFIG="exynos7870-a2corelte_defconfig"
          CONFIG_DIR="arch/arm64/configs"

          echo "::group::Available defconfigs"
          ls -1 $CONFIG_DIR/
          echo "::endgroup::"

          if [ ! -f "$CONFIG_DIR/$BASE_DEFCONFIG" ]; then
            echo "::error::Defconfig not found: $CONFIG_DIR/$BASE_DEFCONFIG"
            exit 1
          fi

          # Create a2corelte defconfig from a6lte if it doesn't exist
          if [ "$BASE_DEFCONFIG" = "$A2_DEFCONFIG" ]; then
            echo "Using existing $A2_DEFCONFIG"
          elif [ ! -f "$CONFIG_DIR/$A2_DEFCONFIG" ]; then
            echo "Creating $A2_DEFCONFIG from $BASE_DEFCONFIG"
            cp "$CONFIG_DIR/$BASE_DEFCONFIG" "$CONFIG_DIR/$A2_DEFCONFIG"
          fi

          DEFCONFIG="$CONFIG_DIR/$A2_DEFCONFIG"

          # Disable FIPS
          sed -i 's/CONFIG_EXYNOS_FIPS_ENABLE=y/CONFIG_EXYNOS_FIPS_ENABLE=n/g' "$DEFCONFIG"
          sed -i 's/CONFIG_CRYPTO_FIPS=y/CONFIG_CRYPTO_FIPS=n/g' "$DEFCONFIG"
          sed -i '/^# CONFIG_EXYNOS_FIPS_ENABLE is not set/d' "$DEFCONFIG"
          sed -i '/^# CONFIG_CRYPTO_FIPS is not set/d' "$DEFCONFIG"
          echo "CONFIG_EXYNOS_FIPS_ENABLE=n" >> "$DEFCONFIG"
          echo "CONFIG_CRYPTO_FIPS=n"         >> "$DEFCONFIG"

          # Force-enable dm-crypt and required algorithms
          for cfg in CONFIG_BLK_DEV_DM CONFIG_DM_CRYPT CONFIG_CRYPTO_AES \
                     CONFIG_CRYPTO_XTS CONFIG_CRYPTO_SHA256 CONFIG_CRYPTO_ECB \
                     CONFIG_CRYPTO_CBC CONFIG_CRYPTO_USER_API_SKCIPHER; do
            sed -i "/^$cfg=/d"               "$DEFCONFIG"
            sed -i "/^# $cfg is not set/d"    "$DEFCONFIG"
            echo "$cfg=y" >> "$DEFCONFIG"
          done

          # Nuclear option: stub out Samsung FIPS init if source exists
          if [ -f security/samsung/tcrypt/fips.c ]; then
            sed -i 's/^int fips_init(void)/int __fips_init_orig(void)/g' \
              security/samsung/tcrypt/fips.c
            echo "int fips_init(void) { return 0; }" \
              >> security/samsung/tcrypt/fips.c
          fi

          # Remove fips140_2_init calls from crypto core
          if [ -f crypto/api.c ]; then
            sed -i 's/fips140_2_init();//g' crypto/api.c
          fi

          echo "::group::Final crypto/FIPS lines in defconfig"
          grep -E "FIPS|DM_CRYPT|DM_|CRYPTO_AES|CRYPTO_XTS|CRYPTO_SHA256" "$DEFCONFIG" || true
          echo "::endgroup::"

      - name: Build kernel
        run: |
          cd ~/kernel
          export CROSS_COMPILE=$HOME/toolchains/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          export PATH="/usr/lib/ccache:$PATH"

          make exynos7870-a2corelte_defconfig
          make -j$(nproc) Image Image.gz dtbs

          echo "::group::Build outputs"
          ls -la arch/arm64/boot/
          echo "::endgroup::"

      - name: Package artifacts
        run: |
          mkdir -p ~/artifacts
          cd ~/kernel/arch/arm64/boot
          cp Image Image.gz ~/artifacts/ 2>/dev/null || true
          cp *.dtb ~/artifacts/ 2>/dev/null || true
          cp dtbo.img ~/artifacts/ 2>/dev/null || true
          cp ~/kernel/arch/arm64/configs/exynos7870-a2corelte_defconfig \
             ~/artifacts/defconfig-used

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a2corelte-build${{ github.run_number }}
          path: ~/artifacts/*

      - name: Build summary
        run: |
          echo "## Kernel Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source | ${{ github.event.inputs.kernel_repo }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.event.inputs.kernel_branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base defconfig | ${{ github.event.inputs.defconfig }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Used defconfig | exynos7870-a2corelte_defconfig |" >> $GITHUB_STEP_SUMMARY
          echo "| FIPS | Disabled |" >> $GITHUB_STEP_SUMMARY
          echo "| dm-crypt | Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifact **kernel-a2corelte-build${{ github.run_number }}**" >> $GITHUB_STEP_SUMMARY
          echo "2. Copy \`Image\` → \`device/samsung/a2corelte/prebuilt/Image\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Copy \`dtbo.img\` (if present) → \`device/samsung/a2corelte/prebuilt/dtbo.img\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Rebuild TWRP: \`make clean && lunch omni_a2corelte-eng && make recoveryimage\`" >> $GITHUB_STEP_SUMMARY
